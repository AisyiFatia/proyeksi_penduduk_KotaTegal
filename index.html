<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIPENDUK TEGAL — Sistem Informasi Proyeksi Penduduk Kota Tegal</title>
    <meta name="description" content="Sistem Informasi Proyeksi Penduduk Kota Tegal 2020–2035. Data resmi berdasarkan Sensus Penduduk BPS & Proyeksi Dinas Dukcapil Kota Tegal." />
    <meta name="keywords" content="SIPENDUK, Kota Tegal, proyeksi penduduk, BPS, Dukcapil, demografi, Jawa Tengah" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <!-- jQuery UI Datepicker -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.3/themes/base/jquery-ui.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.3/jquery-ui.min.js"></script>
    <style>
      /* ── jQuery UI Datepicker — Tema Teal SIPENDUK ── */
      .ui-datepicker { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; border: 1.5px solid #b2dfdb; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,137,123,0.15); padding: 0; overflow: hidden; z-index: 9999 !important; }
      .ui-datepicker-header { background: linear-gradient(135deg, #00897B, #26A69A); border: none; border-radius: 0; padding: 0.6rem 0.5rem; color: #fff; }
      .ui-datepicker-title { color: #fff; font-weight: 700; font-size: 0.85rem; }
      .ui-datepicker-prev, .ui-datepicker-next { top: 0.55rem; background: none; border: none; cursor: pointer; }
      .ui-datepicker-prev .ui-icon, .ui-datepicker-next .ui-icon { background-image: none !important; text-indent: 0; font-style: normal; color: #fff; }
      .ui-datepicker-prev:before { content: "‹"; font-size: 1.3rem; color: #fff; font-weight: 700; }
      .ui-datepicker-next:before { content: "›"; font-size: 1.3rem; color: #fff; font-weight: 700; }
      .ui-datepicker-prev span, .ui-datepicker-next span { display: none; }
      .ui-datepicker table { margin: 0.4rem; width: calc(100% - 0.8rem); }
      .ui-datepicker th { color: #00897B; font-weight: 700; font-size: 0.68rem; text-transform: uppercase; padding: 0.3rem 0; }
      .ui-datepicker td { padding: 2px; }
      .ui-datepicker td a, .ui-datepicker td span { text-align: center; border-radius: 6px; font-size: 0.78rem; color: #37474F; padding: 0.25rem; }
      .ui-datepicker td a:hover { background: #E0F2F1; color: #00897B; border: none; }
      .ui-datepicker td.ui-datepicker-today a { background: #B2DFDB; color: #00695C; font-weight: 700; border: none; }
      .ui-datepicker td.ui-datepicker-current-day a, .ui-state-highlight { background: #00897B !important; color: #fff !important; font-weight: 700; border: none !important; }
      .ui-datepicker select.ui-datepicker-month, .ui-datepicker select.ui-datepicker-year { font-size: 0.78rem; border: 1px solid #b2dfdb; border-radius: 5px; padding: 2px 4px; color: #fff; background: rgba(255,255,255,0.2); margin: 0 2px; cursor: pointer; }
      .ui-datepicker select.ui-datepicker-month option, .ui-datepicker select.ui-datepicker-year option { color: #37474F; background: #fff; }
      .ui-datepicker-buttonpane { border-top: 1px solid #b2dfdb; padding: 0.4rem; }
      .ui-datepicker-buttonpane button { background: #00897B; border: none; color: #fff; border-radius: 5px; font-weight: 600; font-size: 0.75rem; padding: 0.25rem 0.75rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
